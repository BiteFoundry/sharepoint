[package]
name = "sharepoint-cli"
version = "0.4.8"
edition = "2021"
default-run = "sharepoint"
description = "Unified Microsoft SharePoint & OneDrive terminal client & AI agent toolkit — Sites, Document Libraries & Personal Files (CLI, TUI, HTTP API, MCP)"
license = "MIT"
repository = "https://github.com/BiteFoundry/sharepoint"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sharepoint-{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "sharepoint{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "sharepoint_cli"
path = "src/lib.rs"

[[bin]]
name = "sharepoint"
path = "src/main.rs"

[features]
default = ["html-js", "svg-graphics", "desktop-notify"]
html-js = ["bitefoundry-html/js"]
svg-graphics = ["bitefoundry-html/graphics"]
desktop-notify = ["dep:notify-rust"]

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["image-data"] }
axum = "0.8"
base64 = "0.22"
bitefoundry-html = { git = "https://github.com/BiteFoundry/bitefoundry-html", rev = "72273560cd5b689e66d37c81fc957e422855842d", default-features = false, features = ["serve"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = { version = "4", optional = true }
open = "5"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream", "http2", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
unicode-width = "0.2"
url = "2"
urlencoding = "2"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.base64]
opt-level = 3
